[package]
name = "accountsvu"
description = "AccountsVU desktop host (Tauri 2)"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "accountsvu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
av-application.workspace = true
av-persistence.workspace = true
chrono.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# HSN/SAC master download (already in the tree through the updater).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[lints]
workspace = true
