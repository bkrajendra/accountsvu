[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.2.7"
edition = "2024"
authors = ["Rajendra Khope"]
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# internal crates
av-domain = { path = "crates/domain" }
av-accounting = { path = "crates/accounting" }
av-gst-engine = { path = "crates/gst-engine" }
av-persistence = { path = "crates/persistence" }
av-application = { path = "crates/application" }
av-document-render = { path = "crates/document-render" }
av-gst-formats = { path = "crates/gst-formats" }

# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "uuid", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
csv = "1.4"
calamine = "0.38"
sha2 = "0.10"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
aes-gcm = "0.10"
getrandom = "0.3"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"   # money must never touch binary floating point

# Key derivation is deliberately expensive; keep it fast in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
